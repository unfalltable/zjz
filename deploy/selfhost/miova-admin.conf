# Include once inside nginx http {}. There is deliberately no public listener.
# The log_format is declared by 150.158.141.45.conf.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    auth_basic "Miova private administration";
    auth_basic_user_file /etc/miova/admin.htpasswd;
    client_max_body_size 1m;
    client_body_timeout 15s;
    access_log /www/wwwlogs/miova-admin-access.log miova_private;
    error_log /www/wwwlogs/miova-admin-error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy no-referrer always;

    location ~ (^|/)\. { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8081;
        proxy_set_header X-Forwarded-Host localhost:8081;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header oai-authenticated-user-full-name-encoding "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
