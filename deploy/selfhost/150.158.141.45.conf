# Include this file once inside the existing nginx http {} block.
# Retain the original IP vhost and its document root in /srv/miova/backups.
# This vhost does not replace shared nginx, MySQL, or other application services.
log_format miova_private '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time';

# An empty key exempts read-only requests. This is an edge throttle, not a
# substitute for application idempotency, stock guards, or abuse prevention.
map $request_method $miova_mutation_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
}
limit_req_zone $miova_mutation_key zone=miova_mutations:5m rate=2r/s;

server {
    listen 80;
    server_name 150.158.141.45;

    # Dedicated HTTP-01 webroot; a separate verified renewal job must maintain
    # the short-lived IP certificate. The old application is not served.
    location ^~ /.well-known/acme-challenge/ {
        root /srv/miova/acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://150.158.141.45$request_uri;
    }
    access_log /www/wwwlogs/miova-access.log miova_private;
    error_log /www/wwwlogs/miova-error.log warn;
}

server {
    listen 443 ssl;
    server_name 150.158.141.45;
    ssl_certificate /etc/miova/letsencrypt/live/miova-ip/fullchain.pem;
    ssl_certificate_key /etc/miova/letsencrypt/live/miova-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:miova_tls:5m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 64k;
    client_body_timeout 15s;
    limit_req zone=miova_mutations burst=10 nodelay;
    limit_req_status 429;
    access_log /www/wwwlogs/miova-access.log miova_private;
    error_log /www/wwwlogs/miova-error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /ops { return 404; }
    location ^~ /ops/ { return 404; }
    location = /signin-with-chatgpt { return 404; }
    location = /signout-with-chatgpt { return 404; }
    location = /callback { return 404; }
    location ~ (^|/)\. { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host 150.158.141.45;
        proxy_set_header X-Forwarded-Host 150.158.141.45;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header oai-authenticated-user-full-name-encoding "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        # RSC responses and server actions must never be cached by this proxy.
        proxy_buffering off;
    }
}
