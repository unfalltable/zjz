openapi: 3.1.0
info:
  title: MIOVA Commerce API
  version: 1.0.0
  description: Guest storefront API. Database prices and available stock are server-authoritative; payment is disabled. Saved orders are unreserved drafts, not confirmed sales. Browser calls require same origin.
paths:
  /api/v1/catalog:
    get:
      operationId: getCatalog
      description: Search and keyset-page active listings. All products remain reachable beyond 500 records. Follow pageInfo.nextCursor while hasMore is true; never treat one page as the complete shopping-bag catalogue. Invalid historical listings are skipped without ending pagination. Cursors are scoped to the store, normalized search, category, locale and sort; changing those requires a fresh first page. A live catalogue is not a cross-page snapshot, so price and stock remain server-authoritative at checkout.
      parameters:
        - name: q
          in: query
          description: Literal case-insensitive text in product name, SKU, or the chosen locale's description/detail. Unicode case matching runs on the server; this is not a fuzzy or semantic search index.
          schema: {type: string, maxLength: 100, default: ''}
        - name: category
          in: query
          schema: {type: string, enum: [all, home, tech, wear], default: all}
        - name: locale
          in: query
          schema: {type: string, enum: [en, zh, es], default: en}
        - name: sort
          in: query
          description: Featured uses name ascending, not a popularity claim. Every order has a deterministic product-row ID tie-breaker.
          schema: {type: string, enum: [featured, price-low, price-high], default: featured}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          description: Opaque nextCursor from a previous response with the same store/query/sort. The page limit may change. Omit for the first page.
          schema: {type: string, minLength: 1, maxLength: 4096}
      responses:
        '200':
          description: One page of active priced USD listings from D1, locales, destinations and disabled payment availability. A configured empty store returns products [] and hasMore false. Zero stock listings may be present but cannot be ordered. There is no fabricated total count.
          content:
            application/json:
              schema:
                type: object
                required: [ok, apiVersion, currency, locales, destinations, products, payments, pageInfo]
                properties:
                  ok: {const: true}
                  apiVersion: {const: v1}
                  currency: {const: USD}
                  locales: {type: array, items: {enum: [en, zh, es]}}
                  destinations: {type: object, additionalProperties: {$ref: '#/components/schemas/LocalizedText'}}
                  products: {type: array, items: {$ref: '#/components/schemas/Product'}}
                  pageInfo:
                    type: object
                    required: [hasMore, nextCursor]
                    properties:
                      hasMore: {type: boolean}
                      nextCursor: {type: [string, 'null'], description: Non-null exactly when hasMore is true.}
                  payments:
                    type: object
                    properties:
                      enabled: {const: false}
                      code: {const: merchant_verification_required}
                      message: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/orders:
    post:
      operationId: savePendingOrder
      description: Guest checkout; persist an unpaid, unreserved draft using current DB price/stock. A key binds normalized request intent; matching retries return the original snapshot before checking mutable catalog. Different intent with the same key returns 409. No payment, inventory lock or dispatch is initiated.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Checkout'}
      responses:
        '200':
          description: New or existing pending order receipt.
          content:
            application/json:
              schema:
                type: object
                required: [ok, orderNumber, paymentStatus, routeModes, totalCents, inventoryReserved]
                properties:
                  ok: {const: true}
                  orderNumber: {type: string, pattern: '^MW-\d{5,8}$'}
                  paymentStatus: {enum: [pending, paid, failed, refunded], description: New drafts are pending; retries report the original order payment state.}
                  inventoryReserved: {const: false}
                  totalCents: {type: integer, minimum: 0}
                  routeModes: {type: array, items: {$ref: '#/components/schemas/FulfillmentMode'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/orders/track:
    post:
      operationId: trackOrder
      description: Match order number plus checkout email. Email is in the request body, never a URL. Does not return address, email, telephone or customer name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNumber, email]
              properties:
                orderNumber: {type: string, pattern: '^MW-\d{5,8}$'}
                email: {type: string, format: email, maxLength: 254}
      responses:
        '200':
          description: Public order status without recipient PII.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {const: true}
                  order:
                    type: object
                    properties:
                      orderNumber: {type: string}
                      productName: {type: string}
                      amountCents: {type: integer}
                      currency: {type: string}
                      deliveryMethod: {enum: [standard, express, priority]}
                      paymentStatus: {enum: [pending, paid, failed, refunded]}
                      status: {enum: [payment_pending, purchase, packing, handoff, transit, delivered]}
                      progress: {type: integer, minimum: 0, maximum: 100}
                      routeModes: {type: array, items: {$ref: '#/components/schemas/FulfillmentMode'}}
                      createdAt: {type: string, format: date-time}
                      updatedAt: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  responses:
    Error:
      description: Failed validation, unavailable service or request rejected. Body is at most 32 KiB.
      content:
        application/json:
          schema:
            type: object
            required: [ok, message]
            properties:
              ok: {const: false}
              message: {type: string}
              code: {type: string, description: Stable checkout error code when available.}
  schemas:
    FulfillmentMode: {enum: [marketplace, self, supplier]}
    LocalizedText:
      type: object
      required: [en, zh, es]
      properties:
        en: {type: string}
        zh: {type: string}
        es: {type: string}
    Product:
      type: object
      required: [id, sku, name, priceCents, inventory, category, image, badge, description, detail]
      properties:
        id: {type: string}
        sku: {type: string}
        name: {type: string}
        priceCents: {type: integer, minimum: 0}
        compareAtCents: {type: [integer, 'null']}
        price: {type: number, description: Compatibility display value; clients should use priceCents.}
        compareAt: {type: [number, 'null']}
        rating: {type: number}
        reviews: {type: integer}
        color: {enum: [blue, ice, coral]}
        inventory: {type: integer, minimum: 0}
        inventoryReserved: {const: false}
        category: {enum: [home, tech, wear]}
        image: {type: string}
        fulfillmentMode: {$ref: '#/components/schemas/FulfillmentMode'}
        badge: {$ref: '#/components/schemas/LocalizedText'}
        description: {$ref: '#/components/schemas/LocalizedText'}
        detail: {$ref: '#/components/schemas/LocalizedText'}
    Checkout:
      type: object
      required: [idempotencyKey, email, firstName, lastName, address, apartment, city, region, postal, phone, destination, deliveryMethod, marketingOptIn, website, items]
      properties:
        idempotencyKey: {type: string, format: uuid}
        email: {type: string, format: email, maxLength: 254}
        firstName: {type: string, minLength: 1, maxLength: 80}
        lastName: {type: string, minLength: 1, maxLength: 80}
        address: {type: string, minLength: 3, maxLength: 180}
        apartment: {type: string, maxLength: 80}
        city: {type: string, minLength: 1, maxLength: 100}
        region: {type: string, maxLength: 100}
        postal: {type: string, minLength: 3, maxLength: 20}
        phone: {type: string, minLength: 7, maxLength: 30}
        destination: {enum: [US, CA, GB, DE, AU, FR]}
        deliveryMethod: {enum: [standard, express, priority]}
        marketingOptIn: {type: boolean}
        website: {const: ''}
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: Product IDs must be unique; client cannot set prices or fulfillment modes.
          items:
            type: object
            required: [id, quantity]
            properties:
              id: {type: string, minLength: 1, maxLength: 64}
              quantity: {type: integer, minimum: 1, maximum: 10}
